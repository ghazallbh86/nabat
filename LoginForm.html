<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="icon" href="/logo/LOGO (1).png" type="image/png">
    <title>فرم ثبت نام</title>
    <style>
      * {
        font-family: Homa;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        padding: 0;
      }
      @font-face {
        font-family: Homa;
        src: url(/Font/Homa.ttf);
      }
      header {
        width: 100%;
      }
      .container {
        background-color:#FFF3F3;
        padding: 10px 15px;
        border-radius: 10px;
        box-shadow: 1px 1px 10px palevioletred;
        display: flex;
        gap: 10px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: auto;
      }
      .formHeader p {
        color:#FE0081;
        font-size: larger;
        margin-bottom: 0;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
      }
      form input {
        width: 220px;
        background-color:#FFF3F3;;
        border-radius: 5px;
        border: 1px solid rgb(230, 81, 150);
        padding: 4px 10px;
        box-shadow: 1px 1px 10px rgb(240, 162, 175);
      }
      form input::-webkit-input-placeholder {
        color:#FE0081;
      }
      .formbtn input {
        font-size: medium;
        color:#FE0081;
        background-color:#FFF3F3;
        border-radius: 5px;
        border: 1px solid #FE0081;
        padding: 2px 25px;
        box-shadow: 1px 1px 10px rgb(240, 162, 175);
      }
      footer {
        width: 100%;
        margin-top: auto;
      }
    </style>
</head>

<body>
    <header>
      <div class="logo">
        <img src="/logo/LOGO (1).png" alt="">
      </div>
      <div class="menu">
        <ul>
          <li><a href="index.html">صفحه اصلی</a></li>
          <li><a href="store.html">فروشگاه</a></li>
          <li><a href="about us.html">درباره ما</a></li>
          <li><a href="ContactForm.html">ارتباط با ما</a></li>
        </ul>
      </div>
      <div class="search">
        <div class="searchbox">
          <input id="input" class="input" name="text" type="text" />
          <label class="labelforsearch" for="input">
            <i class="fa fa-search"></i>
          </label>
        </div>
        <div class="btn">
          <a href="LoginForm.html"><i class="fa fa-user"></i></a>
          <a href="#"><i class="fab fa-instagram"></i></a>
          <a href="#"><i class="fa fa-heart"></i></a>
          <a href="#"><i class="fa fa-shopping-cart"></i></a>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="formHeader"><p>ورود / ثبت نام</p></div>
      <form>
        <input type="text" placeholder="نام کاربری" />
        <input type="email" placeholder="ایمیل" />
        <input type="password" placeholder="رمز عبور" />
      </form>
      <div class="formbtn">
        <input type="submit" value="ثبت نام" />
        <input type="reset" value="بستن" />
      </div>
    </div>

    <footer>
      <div class="about-footer">
        <p class="footer-title">درباره ی ما</p>
        <div class="about-footer-content">
        <img src="/logo/LOGO (2).png" alt="" width="100px">
          <p class="footer-text">شیراز ، میدان گاز ، جنب پارک آزادی</p>
          <p class="footer-note">لطفا بدون هماهنگی قبلی به دفتر مراجعه نفرمایید</p>
        </div>
      </div>
      
      <div class="trust-footer">
        <p class="footer-title">نماد اعتماد</p>
        <div class="trust-logo">
          <img src="/logo/81 1.png" alt="نماد اعتماد الکترونیکی" width="100">
        </div>
        <div class="trust-footer-content">
        </div>
      </div>
      
      <div class="contact-footer">
        <p class="footer-title">تماس با ما</p>
        <div class="contact-footer-content">
          <div class="social-media">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-telegram"></i></a>
            <a href="#"><i class="fab fa-whatsapp"></i></a>
          </div>
          <p class="footer-text">پشتیبانی: ۰۹۹۹۹۹۹۹۹۹۹</p>
          <p class="footer-text">شنبه تا چهارشنبه ۱۰ صبح تا ۵ بعدازظهر</p>
          <div class="footer-links">
            <a href="#" class="footer-link">قوانین و مقررات</a>
            <a href="#" class="footer-link">وبلاگ</a>
          </div>
        </div>
      </div>
    </footer>
</body>
</html>
